<!DOCTYPE html>

<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>BALMY | Leitor Olist</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * { box-sizing: border-box; }

    body {

      margin: 0;

      padding: 20px;

      font-family: Arial, sans-serif;

      background: #f5f5f5;

      color: #222;

    }

    main { max-width: 520px; margin: auto; }

    h1 { margin-bottom: 4px; }

    .sub { color: #777; }

    .card {

      background: white;

      padding: 18px;

      border-radius: 14px;

      margin-top: 18px;

    }

    button {

      width: 100%;

      padding: 15px;

      background: #333;

      color: white;

      border: none;

      border-radius: 9px;

      font-size: 16px;

      margin-top: 12px;

    }

    #reader { width: 100%; }

    #contador {

      font-size: 48px;

      font-weight: bold;

      text-align: center;

    }

    #status { color: #666; overflow-wrap: anywhere; }

    li { padding: 8px 0; overflow-wrap: anywhere; }

  </style>

</head>

<body>

<main>

  <h1>BALMY</h1>

  <div class="sub">Leitor de Etiquetas | Olist Envios</div>

  <div class="card">

    <div id="contador">0</div>

    <p style="text-align:center">Volumes registrados</p>

  </div>

  <div class="card">

    <button id="iniciar" onclick="iniciarLeitor()">

      Escanear Etiqueta de Envio

    </button>

    <div id="reader"></div>

    <p id="status">Aguardando abertura da câmera.</p>

  </div>

  <div class="card">

    <h3>Etiquetas registradas</h3>

    <ol id="lista"></ol>

  </div>

</main>

<script>

  const codigos = new Set();

  let scanner = null;

  let iniciando = false;

  async function iniciarLeitor() {

    if (scanner || iniciando) return;

    iniciando = true;

    const status = document.getElementById('status');

    const botao = document.getElementById('iniciar');

    botao.disabled = true;

    status.textContent = 'Solicitando acesso à câmera...';

    try {

      scanner = new Html5Qrcode('reader', {

        formatsToSupport: [

          Html5QrcodeSupportedFormats.CODE_128,

          Html5QrcodeSupportedFormats.CODE_39,

          Html5QrcodeSupportedFormats.ITF

        ],

        verbose: false

      });

      await scanner.start(

        { facingMode: 'environment' },

        {

          fps: 10,

          qrbox: (w, h) => ({

            width: Math.floor(w * 0.9),

            height: Math.min(

              Math.floor(h * 0.4),

              160

            )

          })

        },

        (texto) => {

          const codigo = texto.trim();

          if (!codigos.has(codigo)) {

            codigos.add(codigo);

            document.getElementById('contador')

              .textContent = codigos.size;

            const item = document.createElement('li');

            item.textContent = codigo;

            document.getElementById('lista')

              .appendChild(item);

            status.textContent =

              'Etiqueta registrada: ' + codigo;

            if (navigator.vibrate) {

              navigator.vibrate(150);

            }

          }

        },

        () => {}

      );

      status.textContent =

        'Câmera aberta. Aponte para o código de barras.';

    } catch (erro) {

      status.textContent =

        'Erro ao abrir câmera: ' +

        (erro.message || String(erro));

      if (scanner) {

        try { scanner.clear(); } catch (e) {}

      }

      scanner = null;

      botao.disabled = false;

    } finally {

      iniciando = false;

    }

  }

</script>

</body>

</html>
