<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#333333">
  <title>BALMY | Controle de Coletas</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:20px;background:#f4f4f4;color:#242424;font-family:Arial,sans-serif}
    main{max-width:560px;margin:auto}
    h1{margin:0;font-size:32px;letter-spacing:1px}
    .sub{color:#777;margin:6px 0 20px}
    .card{background:#fff;padding:18px;border-radius:14px;margin:14px 0}
    .count{font-size:52px;font-weight:bold;text-align:center}
    .center{text-align:center}
    button{width:100%;border:0;border-radius:9px;padding:14px;margin-top:10px;background:#333;color:#fff;font-size:15px;font-weight:bold;cursor:pointer}
    button.secondary{background:#e9e9e9;color:#222}
    button:disabled{opacity:.5}
    input,select{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px;margin-top:8px;background:white}
    label{display:block;margin-top:8px}
    #reader{width:100%;margin-top:12px;overflow:hidden}
    #reader video{max-width:100%}
    .hidden{display:none!important}
    .status{font-size:13px;color:#666;overflow-wrap:anywhere;line-height:1.5}
    .item{padding:10px 0;border-bottom:1px solid #eee;display:flex;gap:8px;align-items:center;justify-content:space-between}
    .item span{overflow-wrap:anywhere;min-width:0}
    .item button{width:auto;flex-shrink:0;margin:0;padding:8px 10px}
    canvas{width:100%;height:170px;display:block;border:1px solid #ccc;border-radius:8px;background:#fff;touch-action:none}
    .hint{font-size:12px;color:#777;line-height:1.5}
  </style>
</head>
<body>
<main>
  <h1>BALMY</h1>
  <p class="sub">Controle de Coletas</p>

  <section id="leitura">
    <div class="card center">
      <div class="count" id="contador">0</div>
      <div>Volumes registrados</div>
    </div>

    <div class="card">
      <label for="transportadora"><strong>Transportadora da coleta</strong></label>
      <select id="transportadora" onchange="alterarTransportadora()">
        <option value="olist">Olist Envios</option>
        <option value="frenet">Frenet</option>
        <option value="correios">Correios</option>
      </select>

      <p class="hint" id="orientacao">
        Leia o código de barras da etiqueta de envio.
      </p>

      <button id="abrir" onclick="abrirCamera()">
        Escanear etiqueta de envio
      </button>

      <div id="reader"></div>

      <button id="fechar" class="secondary hidden" onclick="fecharCamera()">
        Fechar câmera
      </button>

      <p id="status" class="status" aria-live="polite">
        Aguardando leitura.
      </p>

      <label for="manual">Adicionar código manualmente</label>
      <input
        id="manual"
        inputmode="text"
        autocapitalize="characters"
        autocomplete="off"
        placeholder="Código da etiqueta"
      >
      <button class="secondary" onclick="adicionarManual()">
        Adicionar código
      </button>
    </div>

    <div class="card">
      <h3>Etiquetas registradas</h3>
      <div id="lista"></div>
      <button onclick="abrirConferencia()">
        Finalizar leitura e conferir
      </button>
    </div>
  </section>

  <section id="conferencia" class="hidden">
    <div class="card">
      <h2>Conferência de coleta</h2>
      <p><strong id="totalFinal">0</strong> volumes registrados</p>
      <div id="listaFinal"></div>
      <button class="secondary" onclick="voltarLeitura()">
        Voltar à leitura
      </button>
    </div>

    <div class="card">
      <label for="motorista">
        <strong>Nome do motorista / responsável pela retirada</strong>
      </label>
      <input id="motorista" placeholder="Nome completo" autocomplete="name">

      <h3>Assinatura do motorista</h3>
      <canvas id="assinatura"></canvas>
      <button class="secondary" onclick="limparAssinatura()">
        Limpar assinatura
      </button>

      <p class="hint">
        Assine com o dedo. Confira os volumes antes de finalizar.
      </p>

      <button id="finalizar" onclick="prepararComprovante()">
        Gerar e salvar comprovante PDF
      </button>
      <p id="resultado" class="status" aria-live="polite"></p>
    </div>
  </section>
</main>

<form
  id="formEnvio"
  method="POST"
  action="https://script.google.com/macros/s/AKfycbyNlh6nI2yAwVB0OLUjInlZUtXK4hvvvgqEXfMH6NDTMXrC917luk9sxLbQCDo2E-WI/exec"
  class="hidden"
>
  <input type="hidden" name="codigos" id="envioCodigos">
  <input type="hidden" name="motorista" id="envioMotorista">
  <input type="hidden" name="assinatura" id="envioAssinatura">
  <input type="hidden" name="transportadora" id="envioTransportadora">
</form>

<script>
  const codigos = [];
  let scanner = null;
  let iniciando = false;
  let fechando = false;
  let assinou = false;
  let desenhando = false;
  let enviando = false;
  let audioContext = null;

  const canvas = document.getElementById('assinatura');
  const ctx = canvas.getContext('2d');

  function status(texto) {
    document.getElementById('status').textContent = texto;
  }

  function transportadoraAtual() {
    return document.getElementById('transportadora').value;
  }

  function alterarTransportadora() {
    const tipo = transportadoraAtual();

    const mensagens = {
      olist: 'Leia o código de barras da etiqueta Olist Envios.',
      frenet: 'Leia o código de barras principal da Frenet.',
      correios: 'Leia somente o rastreamento dos Correios, com 13 caracteres. Códigos PLP e DANFE serão ignorados.'
    };

    document.getElementById('orientacao').textContent = mensagens[tipo];

    if (codigos.length) {
      status('Transportadora alterada. Confira os códigos já registrados.');
    }
  }

  function normalizarCodigo(texto) {
    return String(texto || '').trim().toUpperCase();
  }

  function validarCodigo(codigo) {
    const tipo = transportadoraAtual();

    if (!codigo) {
      return { valido: false, motivo: 'Código vazio.' };
    }

    if (tipo === 'correios') {
      const limpo = codigo.replace(/\s+/g, '');

      if (!/^[A-Z]{2}[0-9]{9}[A-Z]{2}$/.test(limpo)) {
        return {
          valido: false,
          motivo: 'Código ignorado. No modo Correios, leia o rastreamento de 13 caracteres.'
        };
      }

      return { valido: true, codigo: limpo };
    }

    // A chave de acesso da NF-e possui 44 dígitos.
    // Ela não deve ser contada como volume de transporte.
    const semEspacos = codigo.replace(/\s+/g, '');

    if (/^[0-9]{44}$/.test(semEspacos)) {
      return {
        valido: false,
        motivo: 'Código da DANFE ignorado. Leia a etiqueta de transporte.'
      };
    }

    // Não aceitar endereços de consulta ou dados extensos
    // que possam ter vindo de códigos auxiliares.
    if (
      codigo.length > 100 ||
      /^https?:\/\//i.test(codigo)
    ) {
      return {
        valido: false,
        motivo: 'Código auxiliar ignorado.'
      };
    }

    // Os padrões exatos da Olist e Frenet serão refinados
    // após os testes com etiquetas reais.
    return { valido: true, codigo: codigo };
  }

  function atualizar() {
    document.getElementById('contador').textContent = codigos.length;
    const lista = document.getElementById('lista');
    lista.replaceChildren();

    codigos.forEach((codigo, i) => {
      const linha = document.createElement('div');
      linha.className = 'item';

      const numero = document.createElement('span');
      numero.textContent = (i + 1) + '. ' + codigo;

      const remover = document.createElement('button');
      remover.className = 'secondary';
      remover.textContent = 'Remover';

      remover.onclick = () => {
        codigos.splice(i, 1);
        atualizar();
      };

      linha.append(numero, remover);
      lista.appendChild(linha);
    });
  }

  function prepararAudio() {
    try {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;

      if (!audioContext) audioContext = new C();

      if (audioContext.state === 'suspended') {
        audioContext.resume().catch(() => {});
      }
    } catch (e) {}
  }

  function avisoSonoro() {
    try {
      if (audioContext && audioContext.state === 'running') {
        const o = audioContext.createOscillator();
        const g = audioContext.createGain();

        o.type = 'sine';
        o.frequency.value = 880;

        g.gain.setValueAtTime(.12, audioContext.currentTime);
        g.gain.exponentialRampToValueAtTime(
          .001,
          audioContext.currentTime + .14
        );

        o.connect(g);
        g.connect(audioContext.destination);
        o.start();
        o.stop(audioContext.currentTime + .15);
      }
    } catch (e) {}

    if (navigator.vibrate) navigator.vibrate(100);
  }

  function registrar(texto) {
    const codigo = normalizarCodigo(texto);
    const resultado = validarCodigo(codigo);

    if (!resultado.valido) {
      status(resultado.motivo);
      return;
    }

    const codigoFinal = resultado.codigo;

    if (codigos.includes(codigoFinal)) {
      status('Etiqueta já registrada: ' + codigoFinal);
      return;
    }

    codigos.push(codigoFinal);
    atualizar();
    avisoSonoro();
    status('Etiqueta registrada: ' + codigoFinal);
  }

  function adicionarManual() {
    const campo = document.getElementById('manual');
    registrar(campo.value);
    campo.value = '';
  }

  async function abrirCamera() {
    if (scanner || iniciando || fechando) return;

    iniciando = true;
    document.getElementById('abrir').disabled = true;
    prepararAudio();
    status('Solicitando acesso à câmera...');

    try {
      if (typeof Html5Qrcode === 'undefined') {
        throw Error('Biblioteca de leitura não carregou.');
      }

      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.ITF,
          Html5QrcodeSupportedFormats.ITF_14,
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.CODABAR
        ],
        verbose: false,
        useBarCodeDetectorIfSupported: true
      });

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 15,
          qrbox: (w, h) => ({
            width: Math.max(1, Math.floor(w * .96)),
            height: Math.max(
              1,
              Math.min(Math.floor(h * .55), 220)
            )
          }),
          disableFlip: true,
          videoConstraints: {
            facingMode: 'environment',
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        },
        texto => registrar(texto),
        () => {}
      );

      document.getElementById('fechar').classList.remove('hidden');
      status('Câmera aberta. Somente códigos de barras habilitados.');

    } catch (e) {
      status('Erro ao abrir câmera: ' + (e.message || e));

      if (scanner) {
        try { await scanner.clear(); } catch (_) {}
        scanner = null;
      }

      document.getElementById('abrir').disabled = false;
    } finally {
      iniciando = false;
    }
  }

  async function fecharCamera() {
    if (!scanner || fechando) return;

    fechando = true;

    try {
      await scanner.stop();
      await scanner.clear();
      status('Câmera fechada. Leituras preservadas.');
    } catch (e) {
      status('Não foi possível fechar a câmera: ' + (e.message || e));
    } finally {
      scanner = null;
      fechando = false;
      document.getElementById('fechar').classList.add('hidden');
      document.getElementById('abrir').disabled = false;
    }
  }

  async function abrirConferencia() {
    if (!codigos.length) {
      alert('Registre ao menos uma etiqueta.');
      return;
    }

    if (iniciando || fechando) {
      alert('Aguarde a câmera terminar a operação.');
      return;
    }

    if (scanner) await fecharCamera();

    document.getElementById('leitura').classList.add('hidden');
    document.getElementById('conferencia').classList.remove('hidden');
    document.getElementById('totalFinal').textContent = codigos.length;

    const lista = document.getElementById('listaFinal');
    lista.replaceChildren();

    codigos.forEach((c, i) => {
      const p = document.createElement('p');
      p.textContent = (i + 1) + '. ' + c;
      lista.appendChild(p);
    });

    configurarCanvas();
    window.scrollTo(0, 0);
  }

  function voltarLeitura() {
    document.getElementById('conferencia').classList.add('hidden');
    document.getElementById('leitura').classList.remove('hidden');
    window.scrollTo(0, 0);
  }

  function configurarCanvas() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.getBoundingClientRect().width;

    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(170 * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#222';

    assinou = false;
    desenhando = false;
  }

  function ponto(e) {
    const r = canvas.getBoundingClientRect();

    return {
      x: e.clientX - r.left,
      y: e.clientY - r.top
    };
  }

  canvas.addEventListener('pointerdown', e => {
    desenhando = true;
    assinou = true;
    canvas.setPointerCapture(e.pointerId);

    const p = ponto(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x + .1, p.y + .1);
    ctx.stroke();
  });

  canvas.addEventListener('pointermove', e => {
    if (!desenhando) return;
    const p = ponto(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  });

  canvas.addEventListener('pointerup', () => desenhando = false);
  canvas.addEventListener('pointercancel', () => desenhando = false);

  function limparAssinatura() {
    configurarCanvas();
  }

  function prepararComprovante() {
    if (enviando) return;

    const nome = document.getElementById('motorista').value.trim();

    if (!codigos.length) {
      alert('Nenhuma etiqueta registrada.');
      return;
    }

    if (!nome) {
      alert('Informe o nome do motorista.');
      return;
    }

    if (!assinou) {
      alert('Peça ao motorista para assinar.');
      return;
    }

    const confirmado = confirm(
      'Confirma a coleta de ' + codigos.length +
      ' volume(s) pelo motorista ' + nome +
      '?\n\nO comprovante será enviado para o Google Drive.'
    );

    if (!confirmado) return;

    document.getElementById('envioCodigos').value =
      JSON.stringify(codigos);

    document.getElementById('envioMotorista').value = nome;
    document.getElementById('envioTransportadora').value = transportadoraAtual();

    document.getElementById('envioAssinatura').value =
      canvas.toDataURL('image/png');

    enviando = true;
    document.getElementById('finalizar').disabled = true;

    document.getElementById('resultado').textContent =
      'Enviando dados ao Google Apps Script. Aguarde a confirmação do PDF.';

    document.getElementById('formEnvio').submit();
  }
</script>
</body>
</html>
